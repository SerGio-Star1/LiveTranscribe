name: APK bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Sprachmodell herunterladen
        run: |
          mkdir -p app/src/main/assets/model-de
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip
          unzip -q model.zip
          cp -r vosk-model-small-de-0.15/* app/src/main/assets/model-de/
      - name: APK bauen
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranscribe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
